name: temp depth charge materialize

on:
  push:
    branches:
      - sync/c70eec1-depth-charge

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/c70eec1-depth-charge

      - name: Apply locked Depth Charge visual sync
        run: python tools/sync_post12_visuals.py --plan data/upstream/post-1.2/c70eec1/depth-charge/sync-plan.json

      - name: Commit generated runtime outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/interfaces/asset-registry.json runtime/BP/blocks/cup_depth_charge.json runtime/RP/models/entity/depth_charge.geo.json runtime/RP/textures/kaleidoscope_tavern/block/mixology/depth_charge.png runtime/RP/textures/kaleidoscope_tavern_jar/block/mixology/depth_charge.png runtime/RP/textures/kaleidoscope_tavern_jar/item/depth_charge.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize Depth Charge post-1.2 sync"
          git push origin HEAD:sync/c70eec1-depth-charge
