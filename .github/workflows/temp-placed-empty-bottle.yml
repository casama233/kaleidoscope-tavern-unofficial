name: temp placed empty bottle validation

on:
  push:
    branches:
      - feat/placed-empty-bottle-carrier

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/placed-empty-bottle-carrier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Rebuild runtime
        run: python tools/build_runtime.py
      - name: Run full C6 tests
        run: python tools/test_c6.py
      - name: Commit generated carrier block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/BP/blocks/bottle_empty.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize placed empty-bottle carrier block"
          git push origin HEAD:feat/placed-empty-bottle-carrier
