name: temp mojito clean render

on:
  push:
    branches:
      - sync/c70eec1-mojito

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/c70eec1-mojito

      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Render cull-aware Mojito comparison
        shell: python
        run: |
          from pathlib import Path
          import importlib.util, json
          from PIL import Image, ImageDraw, ImageFont

          spec=importlib.util.spec_from_file_location("rp","art/tools/render_preview.py")
          rp=importlib.util.module_from_spec(spec); spec.loader.exec_module(rp)
          out=Path("tmp/mojito-clean-render"); out.mkdir(parents=True,exist_ok=True)

          old_geo=json.loads(Path("data/upstream/post-1.2/c70eec1/mojito/baseline/mojito.geo.json").read_text())
          new_geo=json.loads(Path("runtime/RP/models/entity/mojito.geo.json").read_text())
          old_tex=Image.open("data/upstream/post-1.2/c70eec1/mojito/baseline/mojito.png")
          new_tex=Image.open("data/upstream/post-1.2/c70eec1/mojito/updated/mojito.png")

          def render(geo,tex,yaw,pitch=24,size=460):
              return rp.raster(rp.all_faces(rp.decode_geo(geo)),tex,size=size,yaw=yaw,pitch=pitch,cull=True)

          views=[
              ("BEFORE · +35°",render(old_geo,old_tex,35)),
              ("AFTER · +35°",render(new_geo,new_tex,35)),
              ("BEFORE · -35°",render(old_geo,old_tex,-35)),
              ("AFTER · -35°",render(new_geo,new_tex,-35)),
          ]
          canvas=Image.new("RGB",(960,1040),(24,29,34))
          draw=ImageDraw.Draw(canvas)
          fp="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title=ImageFont.truetype(fp,28); label=ImageFont.truetype(fp,19)
          draw.text((28,22),"Mojito · actual geo.json + official texture",font=title,fill=(238,232,222))
          draw.text((28,61),"offline inspection raster · NOT a Minecraft screenshot",font=label,fill=(183,193,200))
          for idx,(name,im) in enumerate(views):
              col=idx%2; row=idx//2; x=20+col*470; y=96+row*465
              canvas.paste(im,(x,y),im)
              draw.text((x+135,y+425),name,font=label,fill=(225,225,225))
          draw.text((28,1012),"baseline: 21 cubes  →  c70eec1 materialized: 20 cubes",font=label,fill=(183,193,200))
          canvas.save(out/"mojito-clean-before-after.webp",format="WEBP",quality=88,method=6)
          compact=canvas.resize((600,650),Image.Resampling.LANCZOS)
          compact.save(out/"mojito-clean-compact.webp",format="WEBP",quality=58,method=6)

      - name: Commit temporary clean preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/mojito-clean-render
          git commit -m "temp: render clean Mojito preview"
          git push origin HEAD:sync/c70eec1-mojito
