name: temp mojito render preview

on:
  push:
    branches:
      - sync/c70eec1-mojito

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/c70eec1-mojito

      - name: Render actual Mojito geometry
        shell: python
        run: |
          from pathlib import Path
          import importlib.util, json
          from PIL import Image, ImageDraw, ImageFont

          spec=importlib.util.spec_from_file_location("rp","art/tools/render_preview.py")
          rp=importlib.util.module_from_spec(spec); spec.loader.exec_module(rp)

          out=Path("tmp/mojito-render"); out.mkdir(parents=True,exist_ok=True)
          old_geo=json.loads(Path("data/upstream/post-1.2/c70eec1/mojito/baseline/mojito.geo.json").read_text())
          new_geo=json.loads(Path("runtime/RP/models/entity/mojito.geo.json").read_text())
          old_tex=Image.open("data/upstream/post-1.2/c70eec1/mojito/baseline/mojito.png")
          new_tex=Image.open("data/upstream/post-1.2/c70eec1/mojito/updated/mojito.png")

          def render(geo,tex,yaw,pitch=24,size=560):
              return rp.raster(rp.all_faces(rp.decode_geo(geo)),tex,size=size,yaw=yaw,pitch=pitch,cull=False)

          old_a=render(old_geo,old_tex,35)
          new_a=render(new_geo,new_tex,35)
          old_b=render(old_geo,old_tex,-35)
          new_b=render(new_geo,new_tex,-35)

          bg=(22,26,31)
          canvas=Image.new("RGB",(1160,1240),bg)
          draw=ImageDraw.Draw(canvas)
          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title=ImageFont.truetype(font_path,30)
          small=ImageFont.truetype(font_path,21)
          draw.text((35,24),"Mojito — actual offline geometry + texture render",font=title,fill=(238,238,238))
          draw.text((35,67),"Left: baseline 6b0d619 / 21 cubes     Right: c70eec1 materialized / 20 cubes",font=small,fill=(190,200,208))
          for im,x,y in [(old_a,20,110),(new_a,580,110),(old_b,20,670),(new_b,580,670)]:
              canvas.paste(im.convert("RGBA"),(x,y),im.convert("RGBA"))
          draw.text((190,620),"BEFORE · yaw +35°",font=small,fill=(220,220,220))
          draw.text((750,620),"AFTER · yaw +35°",font=small,fill=(220,220,220))
          draw.text((190,1180),"BEFORE · yaw -35°",font=small,fill=(220,220,220))
          draw.text((750,1180),"AFTER · yaw -35°",font=small,fill=(220,220,220))
          canvas.save(out/"mojito-before-after.png")

          hero=render(new_geo,new_tex,35,pitch=24,size=720)
          hero.save(out/"mojito-after.png")

      - name: Commit temporary preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/mojito-render
          git commit -m "temp: render Mojito preview"
          git push origin HEAD:sync/c70eec1-mojito
