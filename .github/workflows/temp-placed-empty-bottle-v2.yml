name: temp placed empty bottle v2

on:
  push:
    branches:
      - feat/placed-empty-bottle-carrier-v2

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/placed-empty-bottle-carrier-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Rebuild runtime
        run: python tools/build_runtime.py
      - name: Run full C6 tests
        run: python tools/test_c6.py
      - name: Generated block must already match
        run: git diff --exit-code -- runtime/BP/blocks/bottle_empty.json
