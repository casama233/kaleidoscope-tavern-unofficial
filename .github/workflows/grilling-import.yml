name: Grilling archive import
on:
  push:
    paths:
      - 'imports/READY.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-archive-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and expand owned project archive
        run: python scripts/restore_import.py
      - name: Commit verified project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/grilling imports/IMPORT_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: expand verified Grilling project import'
            git push origin HEAD:main
          fi
