name: Rebuild full Tavern history

on:
  workflow_dispatch:
  push:
    branches: [bootstrap-tavern-history]
    paths:
      - '.github/workflows/rebuild-tavern-history.yml'
      - '_bootstrap/**'

permissions:
  contents: write

concurrency:
  group: tavern-history-bootstrap
  cancel-in-progress: false

jobs:
  rebuild-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          npm install --global typescript

      - name: Preserve bootstrap outside the working tree
        run: |
          mkdir -p /tmp/tavern-bootstrap
          cp _bootstrap/bootstrap.tar.xz /tmp/tavern-bootstrap/bootstrap.tar.xz
          cp _bootstrap/rebuild_history.py /tmp/tavern-bootstrap/rebuild_history.py
          tar -xJf /tmp/tavern-bootstrap/bootstrap.tar.xz -C /tmp/tavern-bootstrap

      - name: Download and verify official Tavern 1.2.0 JAR
        run: |
          set -euo pipefail
          JAR=/tmp/kaleidoscopetavern-1.2.0-neoforge+mc1.21.1.jar
          for URL in \
            'https://mediafilez.forgecdn.net/files/8350/856/kaleidoscopetavern-1.2.0-neoforge%2Bmc1.21.1.jar' \
            'https://www.curseforge.com/api/v1/mods/1475175/files/8350856/download'
          do
            if curl --fail --location --retry 3 --connect-timeout 20 "$URL" --output "$JAR"; then break; fi
          done
          test -s "$JAR"
          echo '03f35e1e614953b22cd1f5e34345613f3a6a283bf1b1c99659b57d58970edeff  '"$JAR" | sha256sum --check
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data
          cp "$JAR" /mnt/data/kaleidoscopetavern-1.2.0-neoforge+mc1.21.1.jar

      - name: Fetch pinned original source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/KaleidoscopeMods/KaleidoscopeTavern.git /tmp/tavern-upstream
          git -C /tmp/tavern-upstream fetch --depth=1 origin 6b0d619145316492f055e03d70427107cd73efa8
          git -C /tmp/tavern-upstream checkout --detach 6b0d619145316492f055e03d70427107cd73efa8

      - name: Reset import branch to preserved empty Tavern base
        run: |
          git config user.name 'Kaleidoscope Tavern Unofficial'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git checkout -B tavern-history-import 2ee1d47d96eb09dff19f1702ffb7db91c84e5652
          git clean -fdx

      - name: Rebuild A17 through C7 and create historical commits
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python /tmp/tavern-bootstrap/rebuild_history.py \
            --bootstrap /tmp/tavern-bootstrap \
            --jar /tmp/kaleidoscopetavern-1.2.0-neoforge+mc1.21.1.jar \
            --upstream /tmp/tavern-upstream \
            --work /tmp/tavern-rebuilt \
            --git-repo "$GITHUB_WORKSPACE" | tee /tmp/tavern-history-commits.json

      - name: Safety audit before push
        run: |
          set -euo pipefail
          ! git ls-tree -r --name-only HEAD | grep -Ei '\.(jar|class|ttf|otf|ttc|woff2?)$'
          ! git ls-tree -r --name-only HEAD | grep -Ei 'cookery.*\.(mcaddon|mcpack|zip|jar)$'
          test -f README.zh-TW.md
          test -f runtime/BP/manifest.json
          test -f docs/TEST-RESULTS.json
          test "$(git rev-list --count 2ee1d47d96eb09dff19f1702ffb7db91c84e5652..HEAD)" -eq 8
          for tag in a17 c1 c2 c3 c4 c5 c6 c7; do git rev-parse "$tag^{commit}" >/dev/null; done
          git log --oneline --decorate -n 12

      - name: Publish generated history branch and tags
        run: |
          git push origin HEAD:refs/heads/tavern-history-import --force
          git push origin refs/tags/a17 refs/tags/c1 refs/tags/c2 refs/tags/c3 refs/tags/c4 refs/tags/c5 refs/tags/c6 refs/tags/c7 --force
