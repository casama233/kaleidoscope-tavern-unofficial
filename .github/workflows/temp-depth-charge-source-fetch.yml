name: temp post12 render inspection

on:
  push:
    branches:
      - sync/c70eec1-depth-charge

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync/c70eec1-depth-charge

      - name: Install render dependencies
        run: python -m pip install pillow numpy

      - name: Render actual repo geometry and textures
        shell: python
        run: |
          from pathlib import Path
          import json, sys
          from PIL import Image, ImageDraw
          sys.path.insert(0, str(Path("art/tools").resolve()))
          from render_preview import decode_geo, all_faces, raster

          out=Path("art/previews/_inspection")
          out.mkdir(parents=True,exist_ok=True)

          def render(geo_path, tex_path, out_path, yaw=35, pitch=28):
              geo=json.loads(Path(geo_path).read_text(encoding="utf-8"))
              tex=Image.open(tex_path)
              img=raster(all_faces(decode_geo(geo)),tex,size=520,yaw=yaw,pitch=pitch)
              img.save(out_path)
              return img

          before=render(
              "data/upstream/post-1.2/c70eec1/depth-charge/baseline/depth_charge.geo.json",
              "data/upstream/post-1.2/c70eec1/depth-charge/baseline/depth_charge_block.png",
              out/"depth_charge_before.png")
          after=render(
              "runtime/RP/models/entity/depth_charge.geo.json",
              "data/upstream/post-1.2/c70eec1/depth-charge/updated/depth_charge_block.png",
              out/"depth_charge_after.png")
          mojito=render(
              "runtime/RP/models/entity/mojito.geo.json",
              "runtime/RP/textures/kaleidoscope_tavern/block/mixology/mojito.png",
              out/"mojito_current.png")

          canvas=Image.new("RGB",(1080,590),(24,29,34))
          canvas.paste(before,(20,50),before)
          canvas.paste(after,(540,50),after)
          d=ImageDraw.Draw(canvas)
          d.text((20,18),"Depth Charge / baseline",fill=(235,235,235))
          d.text((540,18),"Depth Charge / c70eec1 materialized",fill=(235,235,235))
          d.text((20,566),"Offline repo raster · not a Minecraft engine screenshot",fill=(180,185,190))
          canvas.save(out/"depth_charge_compare.png")

          item_old=Image.open("data/upstream/post-1.2/c70eec1/depth-charge/baseline/depth_charge_item.png").convert("RGBA")
          item_new=Image.open("data/upstream/post-1.2/c70eec1/depth-charge/updated/depth_charge_item.png").convert("RGBA")
          item_canvas=Image.new("RGB",(700,360),(24,29,34))
          item_canvas.paste(item_old.resize((256,256),Image.Resampling.NEAREST),(65,55),item_old.resize((256,256),Image.Resampling.NEAREST))
          item_canvas.paste(item_new.resize((256,256),Image.Resampling.NEAREST),(379,55),item_new.resize((256,256),Image.Resampling.NEAREST))
          dd=ImageDraw.Draw(item_canvas)
          dd.text((65,20),"Item baseline",fill=(235,235,235))
          dd.text((379,20),"Item c70eec1",fill=(235,235,235))
          item_canvas.save(out/"depth_charge_item_compare.png")

      - name: Commit inspection renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/previews/_inspection
          git commit -m "temp: render Depth Charge visual inspection"
          git push origin HEAD:sync/c70eec1-depth-charge
